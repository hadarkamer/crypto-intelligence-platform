name: Apply Research Audit Main Patch

on:
  push:
    branches:
      - ai-agent-candidate
    paths:
      - apply_research_audit_main_patch.py

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-agent-candidate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply idempotent Research audit patch
        run: python apply_research_audit_main_patch.py
      - name: Commit patched main.py if changed
        run: |
          if git diff --quiet -- main.py; then
            echo "main.py already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "Apply Research Event audit hook fixes"
          git push origin HEAD:ai-agent-candidate
