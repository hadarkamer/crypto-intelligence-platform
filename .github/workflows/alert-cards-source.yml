name: Data Only Alert Card Forwarding
on:
  push:
    branches: [main, alert-cards-source-v1]
    paths:
      - 'alert_cards_*.py'
      - 'manual_formula_alert_delivery.py'
      - '.github/workflows/alert-cards-source.yml'
permissions:
  contents: read
concurrency:
  group: data-only-alert-cards-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install existing pinned bot dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Data transport, restart, replay and source-hook isolation
        run: python3 -m unittest -v alert_cards_forwarder_selftest alert_cards_pipeline_selftest alert_cards_hook_selftest manual_formula_alert_delivery_selftest
