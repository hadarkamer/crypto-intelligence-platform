name: Production AI Analytics Check

permissions:
  contents: read

concurrency:
  group: production-ai-analytics-check-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - ai-production-analytics
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile every tracked Python module
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile
      - name: Run tracked core self-tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t selftests < <(
            git ls-files '*_selftest.py' |
              sort |
              awk '!/_workflow_selftest\.py$/'
          )
          test "${#selftests[@]}" -gt 0
          printf 'Running %s core self-tests\n' "${#selftests[@]}"
          for selftest in "${selftests[@]}"; do
            echo "::group::$selftest"
            python "$selftest"
            echo "::endgroup::"
          done
      - name: Run tracked Workflow self-tests in isolation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflow_selftests < <(
            git ls-files '*_workflow_selftest.py' | sort
          )
          test "${#workflow_selftests[@]}" -gt 0
          workflow_venv="$RUNNER_TEMP/preview-staging-workflow-venv"
          python -m venv "$workflow_venv"
          "$workflow_venv/bin/python" -m pip install \
            -r requirements.preview-staging-workflow.txt
          printf 'Running %s isolated Workflow self-tests\n' \
            "${#workflow_selftests[@]}"
          for selftest in "${workflow_selftests[@]}"; do
            echo "::group::$selftest"
            "$workflow_venv/bin/python" "$selftest"
            echo "::endgroup::"
          done
      - name: Source integrity
        run: |
          ! grep -R "scan_coinglass_market\|AI_WEB_SEARCH_ENABLED\|web_search" \
            ai_agent.py ai_tools.py ai_telegram.py main.py
