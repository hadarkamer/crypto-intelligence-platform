name: Production AI Analytics Check

permissions:
  contents: read

concurrency:
  group: production-ai-analytics-check-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - ai-production-analytics
      - main
  pull_request:
    branches:
      - main

jobs:
  selftests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      TEST_DATABASE_URL: postgresql://research_test:research_test@localhost:5432/crypto_research_test
      RESEARCH_TEST_POSTGRES_URL: postgresql://research_test:research_test@localhost:5432/crypto_research_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: research_test
          POSTGRES_PASSWORD: research_test
          POSTGRES_DB: crypto_research_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run isolated self-test shard
        run: |
          python .github/scripts/selftest_shards.py run \
            --shard-index ${{ matrix.shard }} --shard-count 4 \
            --manifest ci-selftests-${{ matrix.shard }}.json
      - name: Preserve complete shard receipt
        uses: actions/upload-artifact@v4
        with:
          name: selftests-${{ matrix.shard }}
          path: ci-selftests-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: selftests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require every shard to succeed
        env:
          SELFTEST_RESULT: ${{ needs.selftests.result }}
        run: test "$SELFTEST_RESULT" = success
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: selftests-*
          merge-multiple: true
          path: ci-selftest-manifests
      - name: Verify exact complete self-test coverage
        run: |
          python .github/scripts/selftest_shards.py verify \
            --shard-count 4 --manifests-directory ci-selftest-manifests
      - name: Compile every tracked Python module
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile
      - name: Source integrity
        run: |
          ! grep -R "scan_coinglass_market\|AI_WEB_SEARCH_ENABLED\|web_search" \
            ai_agent.py ai_tools.py ai_telegram.py main.py
      - name: Google Sheets receiver contract
        run: node google_apps_script/selftest.js
