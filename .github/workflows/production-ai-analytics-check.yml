name: Production AI Analytics Check

permissions:
  contents: read

concurrency:
  group: production-ai-analytics-check-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - ai-production-analytics
      - main
  pull_request:
    branches:
      - main

jobs:
  collector_cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile collector page cleanup modules
        run: python -m py_compile coinglass_dom_reader.py coinglass_dom_cleanup_selftest.py
      - name: Run collector page ownership regressions
        run: python coinglass_dom_cleanup_selftest.py
      - name: Run bounded memory diagnostics regressions
        run: |
          python runtime_memory_diagnostics_selftest.py
          python reference_cache_memory_counts_selftest.py
          python memory_diagnostics_hooks_selftest.py
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TEST_DATABASE_URL: postgresql://research_test:research_test@localhost:5432/crypto_research_test
      RESEARCH_TEST_POSTGRES_URL: postgresql://research_test:research_test@localhost:5432/crypto_research_test
      PYTHONPATH: ${{ github.workspace }}/.ci/receiver
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: research_test
          POSTGRES_PASSWORD: research_test
          POSTGRES_DB: crypto_research_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Check out the paired receiver test dependency
        uses: actions/checkout@v4
        with:
          repository: hadarkamer/crypto-intelligence-platform
          ref: 919ba37c3cff917e7d7c0c4c2ffc33a9d6ae8a20
          path: .ci/receiver
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /hl_testnet_runtime/
            /experimental_execution_contract.py
            /experimental_execution_fixtures.py
      - name: Verify receiver dependency provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .ci/receiver rev-parse HEAD)" = "919ba37c3cff917e7d7c0c4c2ffc33a9d6ae8a20"
          test "$(git -C .ci/receiver rev-parse HEAD:hl_testnet_runtime)" = "490b4d6676b1ef9715a4fdf484c475c87258ad2c"
          cmp experimental_execution_contract.py .ci/receiver/experimental_execution_contract.py
          cmp experimental_execution_fixtures.py .ci/receiver/experimental_execution_fixtures.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile every tracked Python module
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile
      - name: Run every tracked self-test
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t selftests < <(git ls-files '*_selftest.py' | sort)
          test "${#selftests[@]}" -gt 0
          printf 'Running %s self-tests\n' "${#selftests[@]}"
          for selftest in "${selftests[@]}"; do
            echo "::group::$selftest"
            python "$selftest"
            echo "::endgroup::"
          done
      - name: Source integrity
        run: |
          ! grep -R "scan_coinglass_market\|AI_WEB_SEARCH_ENABLED\|web_search" \
            ai_agent.py ai_tools.py ai_telegram.py main.py
      - name: Google Sheets receiver contract
        run: node google_apps_script/selftest.js
