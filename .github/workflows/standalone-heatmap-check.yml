name: Offline Firefox chart geometry
on:
  push:
    branches: [qa/coinglass-offline-map-geometry-20261126]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the pilot's pinned Playwright Firefox
        run: |
          python -m pip install 'playwright==1.55.0' 'Pillow==12.3.0'
          python -m playwright install --with-deps firefox
      - name: Replay captured geometry offline in native Firefox
        working-directory: standalone_collector
        run: python -m unittest -v test_geometry_firefox
