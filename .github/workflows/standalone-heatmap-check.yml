name: Check standalone heatmap collector

on:
  pull_request:
    branches:
      - app/model1-standalone-20260915
    paths:
      - standalone_collector/**
      - collection_bridge.py
      - collection_model1_task.py
      - market_vision/coinglass_heatmap_capture.py
      - market_vision/openai_heatmap_scanner.py
      - .github/workflows/standalone-heatmap-check.yml
  push:
    branches:
      - app/model1-standalone-20260915
    paths:
      - standalone_collector/**
      - collection_bridge.py
      - collection_model1_task.py
      - market_vision/coinglass_heatmap_capture.py
      - market_vision/openai_heatmap_scanner.py
      - .github/workflows/standalone-heatmap-check.yml
  workflow_dispatch:
    inputs:
      hover_source_check:
        description: Run one source-only pass of all nine maps (no AI or app writes)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENAI_API_KEY: ""
      DATABASE_URL: ""
      COINGLASS_STORAGE_STATE_JSON: ""
      COINGLASS_COOKIE_HEADER: ""
      COLLECTION_BRIDGE_ENABLED: "false"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install collector test dependencies
        run: >-
          python -m pip install
          'aiohttp==3.11.11' 'requests==2.32.5' 'psycopg[binary]==3.2.3'
          'playwright==1.55.0' 'Pillow==12.3.0' 'pycryptodome==3.21.0'
      - name: Install synthetic DOM test browser
        run: python -m playwright install --with-deps chromium
      - name: Provide local database and Chromium for managed-session fixtures
        shell: bash
        run: |
          set -euo pipefail
          npm install --silent --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/coinglass-test" @electric-sql/pglite@0.5.13
          echo "PGLITE_MODULE=$RUNNER_TEMP/coinglass-test/node_modules/@electric-sql/pglite" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/coinglass-test/bin"
          python - <<'PYTEST'
          from pathlib import Path
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              target = Path(playwright.chromium.executable_path)
              assert target.is_file()
              (Path(os.environ["RUNNER_TEMP"]) / "coinglass-test/bin/chromium").symlink_to(target)
          PYTEST
          echo "$RUNNER_TEMP/coinglass-test/bin" >> "$GITHUB_PATH"
          pg_config --bindir >> "$GITHUB_PATH"
          echo "PG_BIN_FOR_OPERATOR_TESTS=$(pg_config --bindir)" >> "$GITHUB_ENV"
      - name: Prepare actual runtime and run collector contracts
        env:
          COINGLASS_QA_USE_SYSTEM_CHROME: "1"
        run: |
          /opt/google/chrome/chrome --version
          python standalone_collector/prepare.py
      - name: Check the dedicated account flow against synthetic pages and a private test database
        working-directory: standalone_collector
        run: |
          export COINGLASS_TEST_POSTGRES_BIN="$(pg_config --bindir)"
          python -m unittest discover -v -p 'test_dedicated*.py'
      - name: Exercise protected-map fixture and restart the browser against saved local state
        working-directory: standalone_collector
        run: python -m unittest test_session_browser_restart test_operator_login test_collection_metrics -v
      - name: Verify read-only startup and source configuration checks
        working-directory: standalone_collector
        run: python -m unittest test_readiness test_configuration_check test_authenticated_probe -v
      - name: Check whitespace
        run: git diff --check
      - name: Explicit source-only hover acceptance
        # Source access is deliberate; PR checks and reruns never start scans.
        if: >-
          github.run_attempt == 1 &&
          github.event_name == 'workflow_dispatch' && inputs.hover_source_check
        run: python standalone_collector/hover_source_check.py --output hover-source-evidence
      - name: Retain source check evidence
        if: always() && hashFiles('hover-source-evidence/summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hover-source-evidence
          path: hover-source-evidence
          retention-days: 7


  operator-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the dedicated browser image
        id: operator_image
        run: docker build --file standalone_collector/Dockerfile.operator --tag coinglass-operator-test .
      - name: Verify collector confidentiality and Chromium across two real container UIDs
        run: |
          docker run --rm --network none --user 0:0 coinglass-operator-test \
            python standalone_collector/test_operator_container_capabilities.py --check

  qa-preflight-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the inert Render QA image
        run: docker build --file standalone_collector/Dockerfile.operator-qa --tag coinglass-qa-preflight .
      - name: Verify one-shot status on an isolated bridge with a real network interface
        run: |
          set -euo pipefail
          qa_network="$(docker network create --internal coinglass-qa-fixture)"
          qa_container="$(docker run --detach --network "$qa_network" coinglass-qa-preflight)"
          trap 'docker rm -f "$qa_container" >/dev/null; docker network rm "$qa_network" >/dev/null' EXIT
          docker exec --interactive --user 10003:10003 "$qa_container" python -I - <<'PYTEST'
          import json, time, urllib.error, urllib.request
          deadline = time.monotonic() + 135
          base = "http://127.0.0.1:10000"
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(base + "/status", timeout=2) as response:
                      status = json.load(response)
              except (OSError, urllib.error.URLError):
                  time.sleep(.5)
                  continue
              if status.get("phase") == "complete":
                  break
              time.sleep(.5)
          else:
              raise AssertionError("QA status did not complete")
          assert status["dual_uid"]["two_uid_confidential_boundary"] is True
          assert status["dual_uid"]["provider_requests"] == 0
          assert status["private_viewer"]["provider_requests"] == 0
          assert type(status["private_viewer"]["isolated_operator_browser"]) is bool
          assert json.load(urllib.request.urlopen(base + "/health", timeout=2)) == status
          try:
              urllib.request.urlopen(base + "/login", timeout=2)
          except urllib.error.HTTPError as error:
              assert error.code == 404
          else:
              raise AssertionError("QA image exposed an unexpected route")
          print(json.dumps(status,sort_keys=True))
          PYTEST
