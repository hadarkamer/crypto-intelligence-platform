name: Verify packaged BTC numeric reader in isolated Debian 12 runtime
on:
  pull_request:
    types: [opened]
    branches: [fix/coinglass-btc-tesseract-20261127]
permissions:
  contents: read
jobs:
  packaged-offline:
    if: github.event.pull_request.draft && github.head_ref == 'qa/coinglass-tesseract-bookworm-i-20261127' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Confirm product identity
        env:
          PRODUCT_SHA: e2b91677a016a7fe5dcc721d41b7ebd288b250f8
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRODUCT_SHA"
          git diff --exit-code HEAD^ HEAD -- . ':!.github' || exit 1
      - name: Prepare matching Python runtime with ordinary collector wheels
        run: |
          set -euo pipefail
          docker build --platform=linux/amd64 -t decision-hub-ocr-test - <<'CONTAINER'
          FROM python:3.12-slim-bookworm
          RUN python -m pip install --no-cache-dir Pillow==12.3.0 playwright==1.55.0 requests==2.32.5 pycryptodome==3.21.0 'psycopg[binary]==3.2.3'
          CONTAINER
      - name: Test the actual package, source crop and failure behavior offline
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reader-out"
          docker run --rm -i --user "$(id -u):$(id -g)" --platform=linux/amd64 --network=none --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=64 --memory=2g --cpus=1 \
            -v "$GITHUB_WORKSPACE/standalone_collector:/source:ro" -v "$RUNNER_TEMP/reader-out:/out" -w /tmp decision-hub-ocr-test /bin/sh -es <<'OFFLINE'
          . /etc/os-release
          [ "$ID" = debian ] && [ "$VERSION_ID" = 12 ]
          [ "$(uname -m)" = x86_64 ]
          test -x /usr/bin/prlimit
          if command -v tesseract; then exit 1; fi
          mkdir /tmp/reader
          cp -R /source/. /tmp/reader/
          cd /tmp/reader
          python prepare_ocr_runtime.py
          ./ocr_runtime/tesseract --version
          ./ocr_runtime/tesseract --list-langs
          python -m unittest -v test_modern_map_axis_ocr test_modern_map_basic_reader test_modern_map_basic_numbers
          python - <<'PY'
          import json,platform,hashlib,pathlib
          from PIL import Image
          from modern_map_axis_ocr import axis_scale_live
          source=pathlib.Path('fixtures/btc_12h_1841_axis_edge.png')
          observation={}
          with Image.open(source) as image:
              calibrated=axis_scale_live(image,(0,0,140,774),(0,0,65,773),[],observe=observation.update)
          assert calibrated and calibrated[0]=='60,588' and observation['ocr_calls']==1
          assert len(observation['ticks'])==11
          rows=observation['ticks']
          evidence={'source_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),'reference':calibrated[0],'ticks':rows,'ocr_calls':observation['ocr_calls'],'arch':platform.machine(),'os':platform.freedesktop_os_release()['PRETTY_NAME'],'python':platform.python_version(),'english':'eng','network':'none','tesseract':'5.5.0'}
          pathlib.Path('/out/debian12-offline.json').write_text(json.dumps(evidence,indent=2))
          print(json.dumps(evidence))
          PY
          OFFLINE
      - name: Retain offline readiness receipt
        uses: actions/upload-artifact@v4
        with:
          name: debian12-btc-ocr-readiness
          path: ${{ runner.temp }}/reader-out/debian12-offline.json
          if-no-files-found: error
          retention-days: 14
