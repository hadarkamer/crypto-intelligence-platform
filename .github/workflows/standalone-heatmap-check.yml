name: Check standalone heatmap collector

on:
  pull_request:
    branches:
      - app/model1-standalone-20260915
    paths:
      - standalone_collector/**
      - collection_bridge.py
      - collection_model1_task.py
      - market_vision/coinglass_heatmap_capture.py
      - market_vision/openai_heatmap_scanner.py
      - .github/workflows/standalone-heatmap-check.yml
  push:
    branches:
      - app/model1-standalone-20260915
      - test/coinglass-session-path-20261114
    paths:
      - standalone_collector/**
      - collection_bridge.py
      - collection_model1_task.py
      - market_vision/coinglass_heatmap_capture.py
      - market_vision/openai_heatmap_scanner.py
      - .github/workflows/standalone-heatmap-check.yml
  workflow_dispatch:
    inputs:
      hover_source_check:
        description: Run one source-only pass of all nine maps (no AI or app writes)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    if: github.ref != 'refs/heads/test/coinglass-session-path-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENAI_API_KEY: ""
      DATABASE_URL: ""
      COINGLASS_STORAGE_STATE_JSON: ""
      COINGLASS_COOKIE_HEADER: ""
      COLLECTION_BRIDGE_ENABLED: "false"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install collector test dependencies
        run: >-
          python -m pip install
          'aiohttp==3.11.11' 'requests==2.32.5' 'psycopg[binary]==3.2.3'
          'playwright==1.55.0' 'Pillow==12.3.0'
      - name: Install synthetic DOM test browser
        run: python -m playwright install --with-deps chromium
      - name: Prepare actual runtime and run collector contracts
        run: python standalone_collector/prepare.py
      - name: Verify read-only startup and source configuration checks
        working-directory: standalone_collector
        run: python -m unittest test_readiness test_configuration_check test_authenticated_probe -v
      - name: Check whitespace
        run: git diff --check
      - name: Explicit source-only hover acceptance
        # Source access is deliberate; PR checks and reruns never start scans.
        if: >-
          github.run_attempt == 1 &&
          github.event_name == 'workflow_dispatch' && inputs.hover_source_check
        run: python standalone_collector/hover_source_check.py --output hover-source-evidence
      - name: Retain source check evidence
        if: always() && hashFiles('hover-source-evidence/summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hover-source-evidence
          path: hover-source-evidence
          retention-days: 7

  session_wrapper_dummy:
    if: >-
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.ref == 'refs/heads/test/coinglass-session-path-20261114' &&
      contains(github.event.head_commit.message, '[session-secure-https-20261120]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: coinglass-session-path-20261114
      cancel-in-progress: false
    env:
      COINGLASS_COOKIE_HEADER: ""
      COINGLASS_STORAGE_STATE_JSON: ""
      COINGLASS_SESSION_KEY: ""
      DATABASE_URL: ""
      OPENAI_API_KEY: ""
      COLLECTION_BRIDGE_ENABLED: "false"
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Start bounded final-wrapper window
        run: echo "SESSION_PATH_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /standalone_collector/
            /collection_bridge.py
            /collection_model1_task.py
            /market_vision/
            /experiments/model3-preparation-fix-20261031/check_capture.py
            /experiments/session-path-20261114/
      - uses: actions/setup-python@v5
        timeout-minutes: 1
        with:
          python-version: '3.11.11'
      - name: Prepare matched runtime and isolated dependency bundle
        timeout-minutes: 6
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/session-path-browsers"
          python -m venv .venv
          .venv/bin/python -m pip install 'aiohttp==3.11.11' 'requests==2.32.5' 'psycopg[binary]==3.2.3' 'playwright==1.55.0' 'Pillow==12.3.0'
          .venv/bin/python -m playwright install --with-deps chromium
          .venv/bin/python - <<'PYBUNDLE'
          import hashlib,os,pathlib,urllib.request,zipfile
          p=pathlib.Path('experiments/session-path-20261114/wrapper')
          filename='pycryptodome-3.21.0-cp36-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl'
          url='https://files.pythonhosted.org/packages/ea/66/6f2b7ddb457b19f73b82053ecc83ba768680609d56dd457dbc7e902c41aa/'+filename
          (p/'dependencies').mkdir(mode=0o700)
          wheel=p/'dependencies'/filename
          with urllib.request.urlopen(url,timeout=30) as response:
              data=response.read(2254556)
          assert len(data)==2254555
          assert hashlib.sha256(data).hexdigest()=='0714206d467fc911042d01ea3a1847c847bc10884cf674c82e12915cfe1649f8'
          wheel.write_bytes(data)
          with zipfile.ZipFile(wheel) as archive:
              archive.extractall(p/'vendor')
          for directory,dirs,files in os.walk(p):
              os.chmod(directory,0o700)
              for filename in files:os.chmod(pathlib.Path(directory)/filename,0o600)
          print('SESSION_WRAPPER_BUNDLE wheel_sha256_verified=true version=3.21.0 installed_into_venv=false')
          PYBUNDLE
          if ! command -v certutil >/dev/null || ! command -v openssl >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y libnss3-tools openssl
          fi
          command -v certutil
          command -v openssl
          command -v pg_config
          test -x "$(pg_config --bindir)/initdb"
      - name: Exact final wrapper with isolated PostgreSQL and Chromium
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          # Leave more than a minute for cleanup and the action post steps.
          test "$(( $(date +%s) - SESSION_PATH_STARTED ))" -lt 480
          work="$RUNNER_TEMP/session-path-work"
          mkdir -m 700 "$work"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/session-path-browsers"
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          # The Actions agent stays outside; app, PostgreSQL and browser share
          # one namespace that has no network interface or route except loopback.
          timeout --signal=TERM --kill-after=15s 260s sudo unshare \
            --net --pid --fork --kill-child=SIGKILL --mount-proc \
            bash -c '
              set -euo pipefail
              ip link set lo up
              test "$(ip -o link show | wc -l)" -eq 1
              test -z "$(ip route show)"
              test -z "$(ip -6 route show default)"
              exec runuser -u "$1" -- env -i \
                PATH="$2" HOME="$3" TMPDIR="$4" CG_TEST_WORK="$4" \
                PLAYWRIGHT_BROWSERS_PATH="$5" PYTHONUTF8=1 \
                PYTHONDONTWRITEBYTECODE=1 \
                bash "$6"
            ' session-path "$(id -un)" "$PATH" "$HOME" "$work" \
              "$PLAYWRIGHT_BROWSERS_PATH" \
              "$GITHUB_WORKSPACE/experiments/session-path-20261114/run.sh"
      - name: Verify owned cleanup and remove private test files
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          python - "$RUNNER_TEMP/session-path-work" "$RUNNER_TEMP/session-path-browsers" "$GITHUB_WORKSPACE/standalone_collector/runtime" "$GITHUB_WORKSPACE/.venv" "$GITHUB_WORKSPACE/experiments/session-path-20261114/wrapper/vendor" "$GITHUB_WORKSPACE/experiments/session-path-20261114/wrapper/dependencies" "$GITHUB_WORKSPACE/experiments/session-path-20261114/active-wrapper.json" <<'PY'
          import json,os,pathlib,shutil,sys
          paths=list(map(pathlib.Path,sys.argv[1:]))
          survivors=[]
          for directory in pathlib.Path('/proc').iterdir():
              if not directory.name.isdecimal() or int(directory.name)==os.getpid(): continue
              try:
                  args=(directory/'cmdline').read_bytes().split(b'\0')
                  if not args: continue
                  name=pathlib.Path(args[0].decode(errors='ignore')).name
                  if name not in {'postgres','chrome','chromium','headless_shell','chrome-headless-shell','python','python3','python3.11','node'}: continue
                  if any(str(p).encode() in arg for p in paths for arg in args): survivors.append(int(directory.name))
              except (OSError,ValueError): pass
          clean=not survivors
          nss_clean=True
          marker=paths[0]/'tls-nss-owned'
          nss=pathlib.Path.home()/'.pki/nssdb'
          if marker.exists():
              try:
                  if nss.is_dir() and not nss.is_symlink() and nss.stat().st_ino==int(marker.read_text().strip()):
                      shutil.rmtree(nss)
                      marker.unlink()
                  else: nss_clean=False
              except (OSError,ValueError): nss_clean=False
          clean=clean and nss_clean
          for path in paths:
              try:
                  if path.is_dir(): shutil.rmtree(path)
                  elif path.exists(): path.unlink()
              except OSError: clean=False
          clean=clean and all(not path.exists() for path in paths)
          print('SESSION_PATH_WORKSPACE_CLEANUP '+json.dumps({'owned_processes_remaining':len(survivors),'owned_files_removed':all(not p.exists() for p in paths),'temporary_nss_trust_removed':nss_clean,'cleanup_ok':clean}))
          if not clean: raise SystemExit(1)
          PY

