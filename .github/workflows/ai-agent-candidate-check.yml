name: AI Agent Candidate Check

on:
  push:
    branches:
      - ai-agent-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile candidate AI, research and hooked main modules
        run: |
          python -m py_compile main.py ai_history_research.py ai_tools.py ai_agent.py ai_telegram.py ai_candidate_main.py research_event_capture.py research_event_capture_selftest.py research_event_runtime.py research_event_runtime_selftest.py research_shadow_replay.py research_event_store.py research_event_store_selftest.py research_schema_admin.py
      - name: Import candidate AI modules without credentials
        env:
          OPENAI_API_KEY: ""
          DATABASE_URL: ""
          RESEARCH_DATABASE_URL: ""
          RESEARCH_PERSISTENCE_ENABLED: "0"
          RESEARCH_SCHEMA_APPLY: "0"
        run: |
          python - <<'PY'
          import ai_history_research
          import ai_tools
          import ai_agent
          import ai_telegram
          import research_event_capture
          import research_event_runtime
          import research_shadow_replay
          import research_event_store
          import research_schema_admin
          print("tools:", ai_tools.tool_names())
          print("status:", ai_agent.status())
          print("research capture:", research_event_capture.DryRunResearchCapture().status())
          print("research runtime:", research_event_runtime.status())
          print("research persistence:", research_event_store.persistence_status())
          print("research schema admin:", research_schema_admin.status())
          print("shadow replay module: import PASS")
          PY
      - name: Run Research Event capture self-test
        env:
          OPENAI_API_KEY: ""
          DATABASE_URL: ""
        run: python research_event_capture_selftest.py
      - name: Run Research Event runtime mapper self-test
        env:
          OPENAI_API_KEY: ""
          DATABASE_URL: ""
        run: python research_event_runtime_selftest.py
      - name: Run Research Event persistence self-test
        env:
          RESEARCH_DATABASE_URL: ""
          RESEARCH_PERSISTENCE_ENABLED: "0"
        run: python research_event_store_selftest.py
      - name: Verify persistence cannot initialize schema at runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          store = Path('research_event_store.py').read_text(encoding='utf-8')
          upper_store = store.upper()
          if 'CREATE TABLE' in upper_store or 'ALTER TABLE' in upper_store:
              raise SystemExit('Runtime persistence module must not contain schema DDL')
          for marker in [
              'RESEARCH_PERSISTENCE_ENABLED',
              'RESEARCH_DATABASE_URL',
              'RUNTIME_SESSION_ID',
              'retry_current_batch_with_backoff',
              'put_nowait',
          ]:
              if marker not in store:
                  raise SystemExit('Research store missing safety marker: ' + marker)
          migration = Path('migrations/001_research_archive_v1.sql').read_text(encoding='utf-8')
          required = [
              'research_events', 'research_alert_outcomes', 'event_fingerprint',
              'alert_time_utc', 'DECISION_SAMPLE', 'source_side', 'runtime_session_id',
              'delivery_attempted_at_utc', 'delivered_at_utc',
              'time_to_closest_target_seconds', 'path_resolution_seconds',
          ]
          missing = [x for x in required if x not in migration]
          if missing:
              raise SystemExit('Research migration missing: ' + repr(missing))
          admin = Path('research_schema_admin.py').read_text(encoding='utf-8')
          for marker in ['RESEARCH_SCHEMA_APPLY', 'RESEARCH_DATABASE_URL', 'pg_advisory_xact_lock']:
              if marker not in admin:
                  raise SystemExit('Research schema admin missing guard: ' + marker)
          main = Path('main.py').read_text(encoding='utf-8')
          if 'import research_schema_admin' in main:
              raise SystemExit('Watch/main must never import research_schema_admin')
          print('Research persistence safety validation: PASS')
          PY
      - name: Verify live alert hooks remain wired
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('main.py').read_text(encoding='utf-8')
          markers = [
              'import research_event_runtime',
              'decision_time = datetime.now(timezone.utc)',
              'research_event_runtime.capture_sent_maxpain(item, event_time=decision_time)',
              'research_event_runtime.capture_special_transitions(displayable_items)',
              'research_event_runtime.capture_combined_state_changes(candidates)',
              'research_event_runtime.capture_combined_confirmation(candidate)',
              'research_event_runtime.capture_magnet_watch_symbol(',
          ]
          missing = [marker for marker in markers if marker not in text]
          if missing:
              raise SystemExit('Missing Research Event hooks: ' + repr(missing))
          print('Research Event main hook validation: PASS')
          PY
          git diff --check
