name: Apply Research Runtime Hooks

on:
  push:
    branches:
      - ai-agent-candidate
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-agent-candidate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply idempotent Research Event hooks
        run: python scripts/apply_research_runtime_hooks.py
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile changed runtime path
        run: |
          python -m py_compile main.py research_event_capture.py research_event_runtime.py research_event_capture_selftest.py research_event_runtime_selftest.py
      - name: Run Research Event self-tests
        env:
          OPENAI_API_KEY: ""
          DATABASE_URL: ""
        run: |
          python research_event_capture_selftest.py
          python research_event_runtime_selftest.py
      - name: Verify hook markers and diff hygiene
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('main.py').read_text(encoding='utf-8')
          markers = [
              'import research_event_runtime',
              'research_event_runtime.capture_sent_maxpain(item)',
              'research_event_runtime.capture_special_transitions(displayable_items)',
              'research_event_runtime.capture_combined_confirmation(candidate)',
              'research_event_runtime.capture_magnet_watch_symbol(',
          ]
          missing = [marker for marker in markers if marker not in text]
          if missing:
              raise SystemExit('Missing Research Event hooks: ' + repr(missing))
          print('Research Event hook markers: PASS')
          PY
          git diff --check
      - name: Commit Candidate main.py hook wiring
        run: |
          if git diff --quiet -- main.py; then
            echo "main.py already contains the Research Event dry-run hooks."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "Wire live alert paths to Research Event dry run"
          git push origin HEAD:ai-agent-candidate
