name: Controlled Testnet Attempt
on:
  push:
    branches: [paper-trading-v1]
    paths: ['hl_testnet_runtime/**', '.github/workflows/controlled-testnet-attempt.yml']
  pull_request:
    branches: [paper-trading-v1]
    paths: ['hl_testnet_runtime/**', '.github/workflows/controlled-testnet-attempt.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: hl_journal_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d hl_journal_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HL_JOURNAL_CI_URL: postgresql://postgres:disposable-ci-password@127.0.0.1:5432/hl_journal_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install 'psycopg[binary]==3.2.3' 'pycryptodome==3.21.0'
      - run: >-
          python3 -m unittest -q
          hl_testnet_runtime.test_runtime hyperliquid_testnet_executor_selftest
          hl_testnet_runtime.test_guarded_execution hl_testnet_runtime.test_guarded_integration
          hl_testnet_runtime.test_price_precision hl_testnet_runtime.test_postgres_journal
          hl_testnet_runtime.test_mixed_exits hl_testnet_runtime.test_controlled_attempt
          hl_testnet_runtime.test_filled_quantity_dispatch
          hl_testnet_runtime.test_filled_trial_runtime
          hl_testnet_runtime.test_approved_alert_selection
          hl_testnet_runtime.test_long_stream_runtime
          hl_testnet_runtime.test_app_card_delivery
