name: Verify deployed collector health
on:
  push:
    branches: [test/model3-rendering-lab-20261029]
    paths: [.github/workflows/model3-public-asset-review.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read deployed collector health once without account credentials
        run: |
          python3 - <<'PY'
          import json,urllib.request
          from datetime import datetime,timezone
          from pathlib import Path
          url='https://decision-hub-model1-collector.onrender.com/health'
          request=urllib.request.Request(url,headers={'User-Agent':'CollectorReleaseHealthCheck/1.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(request,timeout=30) as response:
              if response.status!=200 or response.url!=url:raise RuntimeError('health_http_check_failed')
              data=response.read(32769)
          if len(data)>32768:raise RuntimeError('unexpected_health_response_size')
          actual=json.loads(data)
          expected={'ok':True,'service':'decision-hub-model1-collector','mode':'collection',
            'source_session_configured':True,'bot_started':False,'scheduled_collection':False,
            'worker_concurrency':1,'numeric_reader':'displayed-hover.v1',
            'supported_models':[1,2,3],'supported_timeframes':['12H','24H','48H']}
          checks={key:actual.get(key)==value for key,value in expected.items()}
          store=actual.get('store_connectivity')
          checks['database_readiness']=isinstance(store,dict) and store.get('checked') is True and store.get('ready') is True
          report={'checked_at_utc':datetime.now(timezone.utc).isoformat(),'http_status':200,
            'passed':all(checks.values()),'checks':checks,'source_scans':0,'ai_calls':0,'application_writes':0,
            'method':'one public GET /health; database readiness performs existing SELECT 1; not an application UI test'}
          Path('collector-release-health.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          if not report['passed']:raise RuntimeError('collector_health_contract_failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collector-release-health
          path: collector-release-health.json
          retention-days: 7
          if-no-files-found: error
