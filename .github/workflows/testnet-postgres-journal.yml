name: Testnet Durable Postgres Journal
on:
  push:
    branches: [paper-trading-v1]
    paths:
      - 'hl_testnet_runtime/**'
      - 'hyperliquid_testnet_executor*.py'
      - '.github/workflows/testnet-postgres-journal.yml'
permissions:
  contents: read
concurrency:
  group: testnet-postgres-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: hl_journal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hl_journal_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HL_JOURNAL_CI_URL: postgresql://postgres:disposable-ci-password@127.0.0.1:5432/hl_journal_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install only PostgreSQL driver for disposable CI database
        run: python3 -m pip install 'psycopg[binary]==3.2.3'
      - name: Existing checks and actual PostgreSQL restart, race, lost-ack and mixed-exit tests
        run: >-
          python3 -m unittest -v
          hl_testnet_runtime.test_runtime
          hyperliquid_testnet_executor_selftest
          hl_testnet_runtime.test_guarded_execution
          hl_testnet_runtime.test_guarded_integration
          hl_testnet_runtime.test_price_precision
          hl_testnet_runtime.test_postgres_journal
          hl_testnet_runtime.test_mixed_exits
