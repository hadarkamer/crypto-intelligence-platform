name: Approved Testnet Price Rounding
on:
  push:
    branches: [paper-trading-v1]
    paths:
      - 'hl_testnet_runtime/*.py'
      - 'hyperliquid_testnet_executor*.py'
      - '.github/workflows/price-rounding-check.yml'
permissions:
  contents: read
concurrency:
  group: testnet-price-rounding-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Existing strict guards and approved rounding - all external actions mocked
        run: python3 -m unittest -v hl_testnet_runtime.test_runtime hyperliquid_testnet_executor_selftest hl_testnet_runtime.test_guarded_execution hl_testnet_runtime.test_guarded_integration hl_testnet_runtime.test_price_precision
